<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="color-scheme" content="dark">
   <title>Grade Checker | Student Portal</title>
   <link rel="stylesheet" href="style.css">
   <script src="script.js" defer></script>
</head>
<body>
   <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
         <div class="brand-mark" aria-hidden="true">GC</div>
         <p class="eyebrow">Student portal</p>
         <h1 id="page-title">Grade Checker</h1>
         <p class="intro">Enter a student ID to view the latest grade records.</p>
      </section>

      <section class="checker-panel" aria-label="Grade lookup">
         <form class="lookup-form" onsubmit="event.preventDefault(); fetchGrades();">
            <div class="field-group">
               <label for="student_id">Student ID</label>
               <input type="text" id="student_id" name="student_id" inputmode="numeric" autocomplete="off" placeholder="e.g. 12345" required>
            </div>
            <button class="submit-button" type="submit">
               <span>Check grades</span>
               <span class="button-arrow" aria-hidden="true">&#8594;</span>
            </button>
         </form>
         <p class="helper-text">Use the numeric ID assigned by your school.</p>
      </section>

      <section class="results-section" aria-live="polite" aria-label="Grade results">
         <div class="section-heading">
            <p class="eyebrow">Results</p>
            <h2>Your grade records</h2>
         </div>
         <div id="result" class="result-panel">
            <p class="empty-state">Your results will appear here after a lookup.</p>
         </div>
      </section>

      <footer class="page-footer">Secure student grade lookup</footer>
   </main>
</body>
</html>
